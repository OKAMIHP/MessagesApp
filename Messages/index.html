<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Messaging Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #messageArea { border: 1px solid #ccc; padding: 10px; height: 200px; overflow-y: scroll; margin-bottom: 10px; }
        #messageInput { width: 70%; padding: 5px; }
        #sendButton { padding: 5px 10px; }
    </style>
</head>
<body>
    <h1>Basic Messaging Demo</h1>
    <div id="messageArea"></div>
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button id="sendButton">Send</button>

    <script>
        const messageArea = document.getElementById('messageArea');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        sendButton.addEventListener('click', function() {
            const message = messageInput.value.trim();
            if (message) {
                const messageElement = document.createElement('p');
                messageElement.textContent = `You: ${message}`;
                messageArea.appendChild(messageElement);
                messageInput.value = '';
                messageArea.scrollTop = messageArea.scrollHeight;
            }
        });

        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendButton.click();
            }
        });
    </script>
</body>
</html>
